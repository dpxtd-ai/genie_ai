# Workflow for deploying static content to GitHub Pages with Angular and .NET support
name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Frontend deployment target for GitHub Pages'
        required: true
        default: 'unified'
        type: choice
        options:
          - 'unified'  # Deploys React at root / and Angular client at /angular/
          - 'angular'  # Deploys Angular client as root site /
          - 'react'    # Deploys React Vite app as root site /

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Build Root React Vite App
      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite application
        run: npm run build

      # 2. Build Angular 19 Client SPA
      - name: Build Angular Client
        run: |
          cd rag_llm/angular
          npm install --legacy-peer-deps
          npm run build -- --configuration production

      # 3. Restore & Build .NET 8.0 Web API
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build .NET Web API
        run: |
          dotnet restore rag_llm/dotnet/src/RagLlm.Api/RagLlm.Api.csproj
          dotnet build rag_llm/dotnet/src/RagLlm.Api/RagLlm.Api.csproj --configuration Release

      # 4. Prepare Deployment Payload based on target_app selection
      - name: Prepare GitHub Pages Payload
        run: |
          TARGET="${{ github.event.inputs.target_app || 'unified' }}"
          echo "Deploying target mode: $TARGET"
          
          if [ "$TARGET" = "angular" ]; then
            # Deploy Angular directly at root
            rm -rf ./deploy-dist
            mkdir -p ./deploy-dist
            cp -r rag_llm/angular/dist/rag-angular-client/browser/* ./deploy-dist/
          elif [ "$TARGET" = "react" ]; then
            # Deploy React directly at root
            rm -rf ./deploy-dist
            mkdir -p ./deploy-dist
            cp -r ./dist/* ./deploy-dist/
          else
            # Unified mode: React at root, Angular at /angular/
            rm -rf ./deploy-dist
            mkdir -p ./deploy-dist
            cp -r ./dist/* ./deploy-dist/
            mkdir -p ./deploy-dist/angular
            cp -r rag_llm/angular/dist/rag-angular-client/browser/* ./deploy-dist/angular/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
