version: '3.8'

services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./dotnet/src/RagLlm.Api/Database/schema_pgvector.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. ASP.NET Core 8.0 Web API Gateway
  rag-dotnet-api:
    build:
      context: ./dotnet
      dockerfile: Dockerfile
    container_name: rag-dotnet-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSql=Host=postgres-pgvector;Port=5432;Database=ragdb;Username=postgres;Password=postgres
      - Rag__VectorStoreProvider=PgVector
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5000:8080"
    depends_on:
      - postgres-pgvector

  # 3. Angular 19 Client SPA
  rag-angular-client:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: rag-angular-client
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - rag-dotnet-api

volumes:
  pgvector-data:
